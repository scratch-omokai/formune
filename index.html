<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>formune</title>
  </head>
  <body>
    <canvas id="game"></canvas>
    <button id="settings-button">
      <img src="/settings.svg" alt="settings">
    </button>
    <div id="settings-panel">
      <section>
        <h2>設定</h2>
        <button id="settings-close">×</button>
      </section>

      <section>
        <h3>感度設定</h3>
        <p>移動の感度</p>
      </section>

      <section>
        <h3>キー設定</h3>
        <p>上に移動</p>
        <p>下に移動</p>
        <p>右に移動</p>
        <p>左に移動</p>
        <p>ズームイン</p>
        <p>ズームアウト</p>
      </section>

      <section>
        <h3>表示設定</h3>
        <p>グリッドを表示</p>
        <p>選択範囲を表示</p>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
